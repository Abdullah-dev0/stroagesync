<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none">
  <defs>
    <linearGradient id="card-fill" x1="164" y1="98" x2="760" y2="558" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDE4FF" stop-opacity="0.42" />
      <stop offset="1" stop-color="#A9B8FF" stop-opacity="0.18" />
    </linearGradient>
    <radialGradient id="center-glow" cx="0" cy="0" r="1" gradientTransform="translate(480 320) rotate(90) scale(240 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.8" />
      <stop offset="0.46" stop-color="#C7D2FE" stop-opacity="0.38" />
      <stop offset="1" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <filter id="outer-glow" x="-35%" y="-45%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32" />
    </filter>
    <filter id="soft-shadow" x="-25%" y="-30%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#172554" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="480" cy="320" rx="325" ry="225" fill="url(#center-glow)" filter="url(#outer-glow)" opacity="0.75" />

  <g filter="url(#soft-shadow)">
    <rect x="219" y="92" width="520" height="368" rx="52" transform="rotate(-5 219 92)" fill="url(#card-fill)" stroke="white" stroke-opacity="0.78" stroke-width="3" />
    <rect x="296" y="116" width="520" height="368" rx="52" transform="rotate(6 296 116)" fill="url(#card-fill)" stroke="white" stroke-opacity="0.7" stroke-width="3" />
    <rect x="155" y="250" width="520" height="368" rx="52" transform="rotate(-10 155 250)" fill="url(#card-fill)" stroke="white" stroke-opacity="0.82" stroke-width="3" />
  </g>
</svg>
